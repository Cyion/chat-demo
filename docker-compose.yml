services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    volumes:
      - ./postgre/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    expose:
      - "8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chatdb
      DB_USER: chat
      DB_PASSWORD: chat
      JWT_SECRET: ${JWT_SECRET:-defaultDevSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Signing}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
