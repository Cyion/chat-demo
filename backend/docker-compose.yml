services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chatdb
      DB_USER: chat
      DB_PASSWORD: chat
      JWT_SECRET: ${JWT_SECRET:-defaultDevSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Signing}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      - postgres

volumes:
  pgdata:
