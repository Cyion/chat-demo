spring.application.name=chat

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chatdb}
spring.datasource.username=${DB_USER:chat}
spring.datasource.password=${DB_PASSWORD:chat}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:defaultDevSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Signing}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

logging.level.de.bredex.chat=DEBUG
logging.level.org.springframework.security=INFO
